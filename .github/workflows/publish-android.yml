name: Publish Native Android Library

on: workflow_dispatch

jobs:
  publish-android:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      version: ${{ steps.publish.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'adopt'
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
      - name: Grant execute permission for publishing script
        run: chmod +x ./scripts/publish-android.sh
      - name: Make local props
        run: |
          cat << EOF > "local.properties"
          centralTokenUsername=${{ secrets.ANDROID_CENTRAL_USERNAME }}
          centralTokenPassword=${{ secrets.ANDROID_CENTRAL_PASSWORD }}
          sonatypeStagingProfileId=${{ secrets.ANDROID_SONATYPE_STAGING_PROFILE_ID }}
          signing.keyId=${{ secrets.ANDROID_SIGNING_KEY_ID }}
          signing.password=${{ secrets.ANDROID_SIGNING_PASSWORD }}
          signing.key=${{ secrets.ANDROID_SIGNING_KEY }}
          EOF
          echo "local.properties file has been created successfully."
      - name: Run publish script
        id: publish
        working-directory: ./scripts
        run: ./publish-android.sh

  create-release:
    # Separate job so only this one gets contents: write; the Gradle build above keeps a read-only token.
    # If the release fails, "Re-run failed jobs" retries it without republishing to Maven Central.
    needs: publish-android
    if: needs.publish-android.outputs.published == 'true' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/next')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish-android.outputs.version }}
        run: |
          if gh release view "$VERSION" > /dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
            exit 0
          fi

          # Release notes: the matching CHANGELOG.md section, falling back to generated notes
          awk -v v="$VERSION" '
            /^## / { if (found) exit; h=$0; sub(/^## \[?v?/, "", h); sub(/\].*$/, "", h); sub(/ .*$/, "", h); if (h == v) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md 2>/dev/null || true

          args=(--target "$GITHUB_SHA" --title "$VERSION")
          if [[ -s release-notes.md ]] && grep -q '[^[:space:]]' release-notes.md; then
            args+=(--notes-file release-notes.md)
          else
            args+=(--generate-notes)
          fi
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$VERSION" "${args[@]}"
